name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + property tests
        run: npm run test:unit
      - name: End-to-end (real Chromium against local fixtures; browser ≡ in-process digests)
        run: npm run test:e2e
      - name: Benchmark sanity gates (claims in the README must hold)
        run: npm run benchmark:check
      - name: Build the static site and check the committed dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/
# CI never contacts a live government or third-party site. `npm run live` is manual only.
